
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sweet Treats Search</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-pink-50 p-8">
    <h1 class="text-4xl font-bold text-center mb-8 text-pink-800">Sweet Treats Search</h1>

    <div class="max-w-4xl mx-auto">
        <form id="searchForm" class="mb-8 flex gap-2 justify-center">
            <input type="text" id="searchInput" placeholder="Search (e.g., Cake, Pie)..." 
                   class="p-2 border border-pink-300 rounded w-64 focus:outline-none focus:ring-2 focus:ring-pink-400">
            
            <button type="submit" class="btn-search bg-pink-600 text-white font-bold py-2 px-4 rounded">
                Search
            </button>
            
            <button type="button" id="clearBtn" class="btn-clear bg-red-500 text-white font-bold py-2 px-4 rounded">
                Clear Results
            </button>
        </form>

        <div id="statusMessage" class="text-center mb-4 font-medium min-h-[1.5rem]"></div>

        <div id="resultsContainer" class="grid grid-cols-1 md:grid-cols-3 gap-6"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
